<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="10%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="90%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filter Effects -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
    
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatKey {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes lineShift {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    .bg-glow-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 15% 30%; }
    .bg-glow-2 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 85% 70%; }
    .floating-icon { animation: floatKey 5s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8 12; animation: lineShift 4s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glows (Strictly behind text & foreground) -->
  <circle cx="150" cy="100" r="220" fill="url(#glowLeft)" class="bg-glow-1" />
  <circle cx="1050" cy="220" r="250" fill="url(#glowRight)" class="bg-glow-2" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" />
  </g>

  <!-- Decorative Keyboard Split Outline Graphics (Background Decorative Sides) -->
  <!-- Left Split Keyboard Outline -->
  <g opacity="0.25" transform="translate(60, 70)" class="floating-icon">
    <rect x="0" y="0" width="140" height="170" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="15" y="15" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="45" y="15" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="75" y="15" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="105" y="15" width="20" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />

    <rect x="15" y="45" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="45" y="45" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="75" y="45" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="105" y="45" width="20" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />

    <rect x="15" y="75" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="45" y="75" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="75" y="75" width="22" height="22" rx="4" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="105" y="75" width="20" height="22" rx="4" fill="#38bdf8" fill-opacity="0.3" />

    <!-- Thumb Cluster -->
    <rect x="70" y="115" width="26" height="38" rx="6" fill="#38bdf8" fill-opacity="0.6" transform="rotate(-15 70 115)" />
    <rect x="102" y="105" width="26" height="38" rx="6" fill="#38bdf8" fill-opacity="0.6" transform="rotate(-25 102 105)" />
  </g>

  <!-- Right Split Keyboard Outline -->
  <g opacity="0.25" transform="translate(1000, 70)" class="floating-icon">
    <rect x="0" y="0" width="140" height="170" rx="12" fill="none" stroke="#c084fc" stroke-width="2" />
    <rect x="15" y="15" width="20" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />
    <rect x="43" y="15" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />
    <rect x="73" y="15" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />
    <rect x="103" y="15" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />

    <rect x="15" y="45" width="20" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />
    <rect x="43" y="45" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.5" />
    <rect x="73" y="45" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.5" />
    <rect x="103" y="45" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />

    <rect x="15" y="75" width="20" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />
    <rect x="43" y="75" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.5" />
    <rect x="73" y="75" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.5" />
    <rect x="103" y="75" width="22" height="22" rx="4" fill="#c084fc" fill-opacity="0.3" />

    <!-- Thumb Cluster -->
    <rect x="12" y="115" width="26" height="38" rx="6" fill="#c084fc" fill-opacity="0.6" transform="rotate(15 12 115)" />
    <rect x="-18" y="105" width="26" height="38" rx="6" fill="#c084fc" fill-opacity="0.6" transform="rotate(25 -18 105)" />
  </g>

  <!-- Connecting Animated Wireless Bridge Line -->
  <path d="M 215,160 Q 600,230 985,160" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" class="animated-line" opacity="0.6" />

  <!-- Foreground Content Block (Clear & Legible) -->
  <g transform="translate(240, 75)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="20" class="badge-text">⌨️ CURATED ERGONOMIC ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text" filter="url(#glowEffect)">
      Awesome Ergonomic Keyboards
    </text>

    <!-- Gradient Line Accent -->
    <rect x="0" y="102" width="720" height="4" rx="2" fill="url(#cyanPurple)" />

    <!-- Subtitle -->
    <text x="0" y="145" class="subtitle-text">
      Split Keyboards • QMK/ZMK Firmware • Tenting Kits • RSI Prevention
    </text>
  </g>
</svg>
